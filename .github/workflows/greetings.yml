name: Greetings

on: [pull_request_target, issues]

permissions: {}

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        issue_message: |
            Thanks for opening your first issue on **guard-agent-go**!

            To help us triage quickly, please make sure your report includes:
            - A clear reproduction (a short Go snippet or failing test is ideal)
            - Output of `go version` and which Go toolchain you build with (`go 1.25.x` or later)
            - The module version you depend on (pin a commit until the first tag) and your `go.mod` requires
            - The ingestion API base URL and which endpoints you hit (events, metrics, status)
            - Redis persistence configuration if relevant (optional Redis-backed queue persistence)

            A few pointers:
            - Scan [README.md](../blob/master/README.md) for usage guidance, and the guard-agent (Python) repository for the normative agent semantics.
            - **Security vulnerability?** Do **not** open a public issue - please use GitHub's private vulnerability reporting. The agent handles API keys and HMAC signing secrets.

            Thanks again - a maintainer will be with you soon.
        pr_message: |
            Thanks for opening your first pull request on **guard-agent-go**!

            Quick checklist before review (most of these are enforced by CI, but worth a glance):
            - [ ] The PR body says `Closes #N` for an open issue (the `issue-link` check enforces it); chores take the `no-issue` label
            - [ ] `gofmt -l .` reports no files
            - [ ] `go vet ./...` is clean
            - [ ] `go test ./...` passes (add `-tags integration` with Redis for the integration suite)
            - [ ] `go build ./...` compiles the agent and the example app
            - [ ] `govulncheck ./...` is clean
            - [ ] If you changed transport or signing behavior, it stays aligned with the ingestion contract (HMAC over the uncompressed body, verified post-decompression server-side) and with guard-agent, guard-agent-rs, guard-agent-php, and guard-agent-ts

            See [README.md](../blob/master/README.md) for the agent contract and [AGENTS.md](../blob/master/AGENTS.md) for the boundary rules.

            Welcome aboard - a maintainer will review shortly.
