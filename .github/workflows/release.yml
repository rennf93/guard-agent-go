name: Release Gate

on:
  push:
    tags:
      - 'v*'

permissions: {}

env:
  GOTOOLCHAIN: auto

jobs:
  test:
    name: Test at tag (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', '1.26.x']
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (unit)
        run: go test ./...

      - name: go test (integration, redis)
        env:
          REDIS_HOST: 127.0.0.1
        run: go test -tags integration ./...

  govulncheck:
    name: govulncheck at tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  module-consumable:
    name: Module tag consumable
    needs: [test, govulncheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Verify module tag resolves
        env:
          MODULE: github.com/rennf93/guard-agent-go
          TAG: ${{ github.ref_name }}
        run: |
          cd "$(mktemp -d)"
          go mod init consumable-check
          GOPROXY=direct go list -m "${MODULE}@${TAG}"
